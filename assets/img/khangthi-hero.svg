<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" width="620" height="500" role="img" aria-labelledby="ktTitle ktDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ktTitle">Giải pháp công nghệ Khang Thị Group</title>
  <desc id="ktDesc">Nền tảng dữ liệu tập trung kết nối bốn giải pháp của Khang Thị Group: trạm cân xe tải điện tử, xử lý ảnh công nghiệp, số hóa tài liệu lưu trữ và menu điện tử iMenu.</desc>

  <defs>
    <filter id="ktShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#eb5d1e" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="ktArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eb5d1e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#eb5d1e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .kt-label { font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #4e4039; }
      .kt-sub   { font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 400; fill: #7a6960; }
      .kt-chip  { font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; font-size: 11px; font-weight: 700; fill: #eb5d1e; }
      .kt-ln    { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- nền -->
  <ellipse cx="310" cy="252" rx="298" ry="232" fill="#fdf1ea"/>

  <!-- đường nối -->
  <g stroke="#e3c8b8" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7" fill="none">
    <path d="M182 138 L206 174"/>
    <path d="M438 138 L414 174"/>
    <path d="M182 362 L206 308"/>
    <path d="M438 362 L414 308"/>
  </g>

  <!-- ===== Bảng điều khiển trung tâm ===== -->
  <g filter="url(#ktShadow)">
    <rect x="196" y="168" width="228" height="144" rx="13" fill="#ffffff" stroke="#f1ddd2" stroke-width="1.5"/>
  </g>
  <path d="M196 195 H424" stroke="#f1ddd2" stroke-width="1.5"/>
  <circle cx="212" cy="182" r="3.4" fill="#eb5d1e"/>
  <circle cx="224" cy="182" r="3.4" fill="#f9a97e"/>
  <circle cx="236" cy="182" r="3.4" fill="#e3d5cd"/>

  <!-- cột -->
  <g>
    <rect x="214" y="252" width="15" height="30" rx="3" fill="#f9a97e"/>
    <rect x="237" y="234" width="15" height="48" rx="3" fill="#eb5d1e"/>
    <rect x="260" y="258" width="15" height="24" rx="3" fill="#f9a97e"/>
    <rect x="283" y="222" width="15" height="60" rx="3" fill="#eb5d1e"/>
  </g>
  <path d="M208 282 H304" stroke="#f1ddd2" stroke-width="1.5"/>
  <path d="M312 212 V282" stroke="#f7e8e0" stroke-width="1.5"/>

  <!-- biểu đồ đường -->
  <path d="M326 258 L350 240 L374 247 L398 221 L410 214 L410 278 L326 278 Z" fill="url(#ktArea)"/>
  <path class="kt-ln" d="M326 258 L350 240 L374 247 L398 221 L410 214" stroke="#eb5d1e" stroke-width="2.6"/>
  <g fill="#ffffff" stroke="#eb5d1e" stroke-width="2">
    <circle cx="326" cy="258" r="3"/>
    <circle cx="350" cy="240" r="3"/>
    <circle cx="374" cy="247" r="3"/>
    <circle cx="398" cy="221" r="3"/>
  </g>
  <text class="kt-sub" x="310" y="301" text-anchor="middle">Nền tảng dữ liệu tập trung</text>

  <!-- chân đế -->
  <path d="M296 312 L288 328 H332 L324 312 Z" fill="#ddc9be"/>
  <rect x="274" y="328" width="72" height="7" rx="3.5" fill="#4e4039"/>

  <!-- ===== 1. Trạm cân xe tải ===== -->
  <g transform="translate(12,26)">
    <g filter="url(#ktShadow)">
      <rect x="0" y="0" width="170" height="112" rx="15" fill="#ffffff" stroke="#f1ddd2" stroke-width="1.5"/>
    </g>
    <!-- bảng trọng lượng -->
    <rect x="14" y="9" width="44" height="21" rx="6" fill="#fff5f0" stroke="#eb5d1e" stroke-width="1.5"/>
    <text class="kt-chip" x="36" y="24" text-anchor="middle">80 T</text>
    <!-- cột và camera nhận diện biển số -->
    <path d="M146 26 V66" stroke="#d8c6bd" stroke-width="3" stroke-linecap="round"/>
    <rect x="142" y="24" width="8" height="5" rx="2" fill="#c2b7b1"/>
    <g transform="rotate(-12 140 20)">
      <rect x="134" y="13" width="27" height="13" rx="4" fill="#4e4039"/>
      <rect x="127" y="16" width="8" height="7" rx="2" fill="#4e4039"/>
      <circle cx="123" cy="19.5" r="3.2" fill="#eb5d1e"/>
    </g>
    <path class="kt-ln" d="M120 27 L131 44" stroke="#eb5d1e" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.75"/>
    <!-- xe tải -->
    <rect x="34" y="28" width="52" height="29" rx="3" fill="#eb5d1e"/>
    <rect x="34" y="28" width="52" height="6" rx="3" fill="#ef7f4d" opacity="0.55"/>
    <path d="M88 36 q0 -3 3 -3 H107 v14 h9 l7 6 v4 H88 Z" fill="#ef7f4d"/>
    <rect x="92" y="37" width="13" height="9" rx="2" fill="#ffffff" opacity="0.92"/>
    <g fill="#4e4039">
      <circle cx="48" cy="60" r="6"/>
      <circle cx="72" cy="60" r="6"/>
      <circle cx="104" cy="60" r="6"/>
    </g>
    <g fill="#ffffff" opacity="0.85">
      <circle cx="48" cy="60" r="2.1"/>
      <circle cx="72" cy="60" r="2.1"/>
      <circle cx="104" cy="60" r="2.1"/>
    </g>
    <!-- bàn cân -->
    <rect x="26" y="66" width="118" height="8" rx="4" fill="#4e4039"/>
    <rect x="38" y="74" width="10" height="5" rx="2" fill="#c2b7b1"/>
    <rect x="122" y="74" width="10" height="5" rx="2" fill="#c2b7b1"/>
    <text class="kt-label" x="85" y="98" text-anchor="middle">Trạm cân xe tải</text>
  </g>

  <!-- ===== 2. Xử lý ảnh công nghiệp ===== -->
  <g transform="translate(438,26)">
    <g filter="url(#ktShadow)">
      <rect x="0" y="0" width="170" height="112" rx="15" fill="#ffffff" stroke="#f1ddd2" stroke-width="1.5"/>
    </g>
    <!-- vùng quét -->
    <path d="M86 42 L56 65 H116 Z" fill="#eb5d1e" opacity="0.16"/>
    <!-- camera công nghiệp -->
    <rect x="68" y="8" width="36" height="20" rx="5" fill="#4e4039"/>
    <rect x="79" y="27" width="14" height="7" rx="2" fill="#4e4039"/>
    <circle cx="86" cy="38" r="5.6" fill="#eb5d1e"/>
    <circle cx="84" cy="36" r="1.8" fill="#ffffff" opacity="0.9"/>
    <!-- sản phẩm trên băng chuyền -->
    <rect x="40" y="45" width="22" height="17" rx="3" fill="#f9a97e"/>
    <rect x="74" y="45" width="22" height="17" rx="3" fill="#ffffff" stroke="#eb5d1e" stroke-width="2"/>
    <path class="kt-ln" d="M81 50 L89 58 M89 50 L81 58" stroke="#eb5d1e" stroke-width="2.4"/>
    <rect x="108" y="45" width="22" height="17" rx="3" fill="#f9a97e"/>
    <!-- băng chuyền -->
    <circle cx="34" cy="67" r="8" fill="#c2b7b1"/>
    <circle cx="136" cy="67" r="8" fill="#c2b7b1"/>
    <rect x="28" y="63" width="114" height="9" rx="4.5" fill="#4e4039"/>
    <g stroke="#8d7c73" stroke-width="2" stroke-linecap="round">
      <path d="M50 67.5 H58"/>
      <path d="M81 67.5 H89"/>
      <path d="M112 67.5 H120"/>
    </g>
    <text class="kt-label" x="85" y="98" text-anchor="middle">Xử lý ảnh công nghiệp</text>
  </g>

  <!-- ===== 3. Số hóa tài liệu ===== -->
  <g transform="translate(12,362)">
    <g filter="url(#ktShadow)">
      <rect x="0" y="0" width="170" height="112" rx="15" fill="#ffffff" stroke="#f1ddd2" stroke-width="1.5"/>
    </g>
    <!-- chồng hồ sơ giấy -->
    <rect x="34" y="18" width="38" height="48" rx="4" fill="#fcebe3" stroke="#e8cfc2" stroke-width="1.5"/>
    <rect x="29" y="23" width="38" height="48" rx="4" fill="#fdf1ea" stroke="#e8cfc2" stroke-width="1.5"/>
    <rect x="24" y="28" width="38" height="48" rx="4" fill="#ffffff" stroke="#c2b7b1" stroke-width="1.5"/>
    <g fill="#e3c8b8">
      <rect x="31" y="37" width="24" height="3.4" rx="1.7"/>
      <rect x="31" y="46" width="24" height="3.4" rx="1.7"/>
      <rect x="31" y="55" width="15" height="3.4" rx="1.7"/>
    </g>
    <!-- mũi tên -->
    <path class="kt-ln" d="M70 50 H92 M86 44 L92 50 L86 56" stroke="#eb5d1e" stroke-width="2.4"/>
    <!-- đám mây lưu trữ -->
    <g fill="#eb5d1e">
      <circle cx="108" cy="52" r="10"/>
      <circle cx="122" cy="45" r="15"/>
      <circle cx="137" cy="53" r="9"/>
      <rect x="98" y="52" width="48" height="10" rx="5"/>
    </g>
    <path class="kt-ln" d="M114 48 L120 55 L132 40" stroke="#ffffff" stroke-width="2.8"/>
    <text class="kt-label" x="85" y="98" text-anchor="middle">Số hóa tài liệu</text>
  </g>

  <!-- ===== 4. iMenu ===== -->
  <g transform="translate(438,362)">
    <g filter="url(#ktShadow)">
      <rect x="0" y="0" width="170" height="112" rx="15" fill="#ffffff" stroke="#f1ddd2" stroke-width="1.5"/>
    </g>
    <!-- điện thoại + mã QR -->
    <rect x="34" y="12" width="46" height="66" rx="8" fill="#ffffff" stroke="#4e4039" stroke-width="2.4"/>
    <rect x="48" y="19" width="18" height="3" rx="1.5" fill="#c2b7b1"/>
    <g fill="none" stroke="#eb5d1e" stroke-width="2.2">
      <rect x="41" y="29" width="12" height="12" rx="2"/>
      <rect x="61" y="29" width="12" height="12" rx="2"/>
      <rect x="41" y="49" width="12" height="12" rx="2"/>
    </g>
    <g fill="#eb5d1e">
      <rect x="61" y="49" width="5" height="5" rx="1"/>
      <rect x="68" y="56" width="5" height="5" rx="1"/>
      <rect x="61" y="63" width="5" height="5" rx="1"/>
      <rect x="45" y="65" width="5" height="5" rx="1"/>
      <rect x="54" y="35" width="4" height="4" rx="1"/>
    </g>
    <!-- món ăn -->
    <g class="kt-ln" stroke="#f9a97e" stroke-width="2.2" opacity="0.85">
      <path d="M109 34 q6 -7 0 -13 q-5 -6 1 -11"/>
      <path d="M127 34 q6 -7 0 -13 q-5 -6 1 -11"/>
    </g>
    <ellipse cx="118" cy="62" rx="26" ry="5" fill="#e3d5cd"/>
    <path d="M97 61 a21 17 0 0 1 42 0 Z" fill="#ef7f4d"/>
    <circle cx="118" cy="43" r="3.6" fill="#eb5d1e"/>
    <rect x="92" y="60" width="52" height="6" rx="3" fill="#c2b7b1"/>
    <text class="kt-label" x="85" y="98" text-anchor="middle">Menu điện tử iMenu</text>
  </g>
</svg>
