<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 596" width="440" height="596" role="img" aria-labelledby="ktTitleM ktDescM" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ktTitleM">Giải pháp công nghệ Khang Thị Group</title>
  <desc id="ktDescM">Nền tảng dữ liệu tập trung kết nối bốn giải pháp của Khang Thị Group: trạm cân xe tải điện tử, xử lý ảnh công nghiệp, số hóa tài liệu lưu trữ và menu điện tử iMenu.</desc>

  <defs>
