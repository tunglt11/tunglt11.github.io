      .kt-chip  { font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #eb5d1e; }
      .kt-ln    { fill: none; stroke-linecap: round; stroke-linejoin: round; }
