    </filter>
    <linearGradient id="ktArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eb5d1e" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#eb5d1e" stop-opacity="0"/>
    </linearGradient>
    <style>
